<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.json" />
  <title>Workout Tracker</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #111827; color: #f9fafb; margin: 0; padding: 16px; padding-bottom: 48px; }
    .card { background: #1f2937; padding: 16px; border-radius: 12px; margin-bottom: 16px; }
    h2, h3 { margin-top: 0; }
    input, button { width: 100%; padding: 11px; margin-top: 8px; border-radius: 8px; border: none; font-size: 16px; box-sizing: border-box; }
    input { background: #374151; color: #fff; }
    button { background: #3b82f6; color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button.secondary { background: #4b5563; }
    button.success { background: #059669; }
    button.danger { background: #dc2626; }
    button.small { padding: 7px 10px; font-size: 13px; width: auto; margin-top: 0; }
    .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    .row button { margin-top: 0; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; background: #1f2937; color: #9ca3af; padding: 10px; margin-top: 0; }
    .tab-btn.active { background: #3b82f6; color: #fff; }
    .timer-display { font-size: 36px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; margin: 6px 0; color: #60a5fa; }
    .timer-display.done { color: #34d399; }
    .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #9ca3af; margin-bottom: 12px; }
    .badge { padding: 4px 10px; border-radius: 999px; font-weight: 600; font-size: 12px; cursor: pointer; border: none; width: auto; margin: 0; }
    .badge.on { background: #065f46; color: #6ee7b7; }
    .badge.off { background: #374151; color: #d1d5db; }
    .routine-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #374151; padding: 12px 0; }
    .routine-item:last-child { border-bottom: none; }
    .prev-banner { background: #111827; padding: 8px 10px; border-radius: 8px; font-size: 13px; color: #93c5fd; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .set-row { display: grid; grid-template-columns: 36px 1fr 1fr 48px; gap: 8px; align-items: center; margin-top: 8px; padding: 4px; border-radius: 8px; transition: background 0.2s; }
    .set-row.completed { background: rgba(6, 95, 70, 0.35); }
    .set-row input { margin-top: 0; padding: 9px; text-align: center; }
    .set-num { font-weight: 700; color: #9ca3af; text-align: center; font-size: 14px; }
    .check-btn { margin-top: 0; padding: 9px 0; background: #374151; font-size: 16px; }
    .set-row.completed .check-btn { background: #059669; }
    .log-item { border-bottom: 1px solid #374151; padding: 10px 0; font-size: 14px; }
    .log-item:last-child { border-bottom: none; }
    .error-box { background: #7f1d1d; color: #fecaca; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; word-break: break-word; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- Global Error Banner (shows script or Firebase issues immediately on iPhone) -->
  <div id="global-error" class="error-box hidden"></div>

  <!-- Login Screen -->
  <div id="auth-section" class="card">
    <h2>Sign In</h2>
    <input type="email" id="email" placeholder="Email" autocomplete="email" />
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
    <button id="login-btn">Log In</button>
    <p id="auth-error" style="color:#f87171; font-size:14px;"></p>
  </div>

  <!-- Main Workout App -->
  <div id="app-section" class="hidden">

    <!-- Screen Wake Lock Bar -->
    <div class="status-bar">
      <span>Workout Mode</span>
      <button id="wakelock-btn" class="badge off">Screen Awake: OFF</button>
    </div>

    <!-- Rest Timer Card -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="margin:0;">Rest Timer</h3>
        <span id="default-rest-label" style="font-size:13px; color:#9ca3af;">Auto-start: 90s</span>
      </div>
      <div id="timer-display" class="timer-display">01:30</div>
      <div class="row">
        <button class="secondary preset-btn" data-sec="60">1:00</button>
        <button class="secondary preset-btn" data-sec="90">1:30</button>
        <button class="secondary preset-btn" data-sec="120">2:00</button>
        <button class="secondary preset-btn" data-sec="180">3:00</button>
      </div>
      <div class="row">
        <button id="timer-minus" class="secondary">-15s</button>
        <button id="timer-toggle">Start</button>
        <button id="timer-plus" class="secondary">+15s</button>
        <button id="timer-reset" class="danger">Reset</button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs">
      <button id="tab-routines" class="tab-btn active">Routines</button>
      <button id="tab-quick" class="tab-btn">Quick Set</button>
      <button id="tab-history" class="tab-btn">History</button>
    </div>

    <!-- VIEW 1: Routines & Active Workout -->
    <div id="view-routines">
      <div id="routine-manager">
        <div class="card">
          <h3>My Routines (Unlimited)</h3>
          <div id="routines-list">Loading routines...</div>
        </div>

        <div class="card">
          <h3>Create New Routine</h3>
          <input type="text" id="new-routine-name" placeholder="Routine Name (e.g., Push Day A)" />
          <div id="builder-exercises"></div>
          <div class="row" style="margin-top:12px;">
            <input type="text" id="builder-ex-name" placeholder="Exercise name" style="margin-top:0; flex:2;" />
            <input type="number" id="builder-ex-sets" placeholder="Sets" value="3" inputmode="numeric" style="margin-top:0; flex:1;" />
            <button id="add-builder-ex-btn" class="secondary small" style="padding:11px 14px;">+ Add</button>
          </div>
          <button id="save-routine-btn" class="success" style="margin-top:12px;">Save Routine</button>
        </div>
      </div>

      <div id="active-workout" class="hidden">
        <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <span style="font-size:12px; color:#34d399; font-weight:700;">ACTIVE WORKOUT</span>
            <h2 id="active-routine-title" style="margin:2px 0 0 0;">Push Day</h2>
          </div>
          <button id="finish-workout-btn" class="success small" style="padding:10px 14px;">Finish</button>
        </div>
        <div id="active-exercises-container"></div>
      </div>
    </div>

    <!-- VIEW 2: Quick Single Set Logger -->
    <div id="view-quick" class="hidden">
      <div class="card">
        <h3>Log a Single Set</h3>
        <input type="text" id="quick-exercise" placeholder="Exercise (e.g., Bench Press)" />
        <div id="quick-prev-banner" class="prev-banner hidden" style="margin-top:8px; margin-bottom:0;"></div>
        <input type="number" id="quick-weight" placeholder="Weight (lbs)" inputmode="decimal" />
        <input type="number" id="quick-reps" placeholder="Reps" inputmode="numeric" />
        <button id="quick-save-btn">Save Set & Start Rest</button>
      </div>
    </div>

    <!-- VIEW 3: Recent History -->
    <div id="view-history" class="hidden">
      <div class="card">
        <h3>Recent Sets</h3>
        <div id="history-list">Loading...</div>
      </div>
    </div>

    <button id="logout-btn" class="secondary" style="margin-top:8px;">Sign Out</button>
  </div>

  <!-- Catch any syntax or runtime error and display it on screen -->
  <script>
    window.addEventListener("error", (e) => {
      const box = document.getElementById("global-error");
      box.textContent = "App Error: " + e.message;
      box.classList.remove("hidden");
    });
  </script>

    const wakeLockBtn = document.getElementById("wakelock-btn");

      if (!("wakeLock" in navigator)) {
        wakeLockBtn.textContent = "Wake Lock Unsupported";
        return;
      }
      try {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLockBtn.textContent = "Screen Awake: ON";
        wakeLockBtn.className = "badge on";
        wakeLock.addEventListener("release", () => {
          wakeLockBtn.textContent = "Screen Awake: OFF";
          wakeLockBtn.className = "badge off";
        });
      } catch (err) {
        wakeLockBtn.textContent = "Tap to Keep Awake";
        wakeLockBtn.className = "badge off";
      }
    }

      if (wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }
