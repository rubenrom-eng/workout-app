<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.json" />
  <title>Workout Tracker</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #111827; color: #f9fafb; margin: 0; padding: 20px; padding-bottom: 40px; }
    .card { background: #1f2937; padding: 16px; border-radius: 12px; margin-bottom: 16px; }
    h2, h3 { margin-top: 0; }
    input, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: none; font-size: 16px; box-sizing: border-box; }
    input { background: #374151; color: #fff; }
    button { background: #3b82f6; color: #fff; font-weight: 600; cursor: pointer; }
    button.secondary { background: #4b5563; }
    button.danger { background: #dc2626; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    .row button { margin-top: 0; padding: 10px 8px; font-size: 14px; }
    .timer-display { font-size: 40px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; margin: 8px 0; color: #60a5fa; }
    .timer-display.done { color: #34d399; }
    .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #9ca3af; margin-bottom: 12px; }
    .badge { padding: 4px 10px; border-radius: 999px; font-weight: 600; font-size: 12px; cursor: pointer; border: none; width: auto; margin: 0; }
    .badge.on { background: #065f46; color: #6ee7b7; }
    .badge.off { background: #374151; color: #d1d5db; }
    .log-item { border-bottom: 1px solid #374151; padding: 10px 0; font-size: 14px; }
    .log-item:last-child { border-bottom: none; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="auth-section" class="card">
    <h2>Sign In</h2>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button id="login-btn">Log In</button>
    <p id="auth-error" style="color:#f87171; font-size:14px;"></p>
  </div>

  <!-- Main Workout App -->
  <div id="app-section" class="hidden">

    <!-- Screen Wake Lock Status Bar -->
    <div class="status-bar">
      <span>Workout Mode</span>
      <button id="wakelock-btn" class="badge off">Screen Lock: Off</button>
    </div>

    <!-- Rest Timer Card -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="margin:0;">Rest Timer</h3>
        <span id="default-rest-label" style="font-size:13px; color:#9ca3af;">Auto-start: 90s</span>
      </div>
      <div id="timer-display" class="timer-display">01:30</div>
      <div class="row">
        <button class="secondary preset-btn" data-sec="60">1:00</button>
        <button class="secondary preset-btn" data-sec="90">1:30</button>
        <button class="secondary preset-btn" data-sec="120">2:00</button>
        <button class="secondary preset-btn" data-sec="180">3:00</button>
      </div>
      <div class="row">
        <button id="timer-minus" class="secondary">-15s</button>
        <button id="timer-toggle">Start</button>
        <button id="timer-plus" class="secondary">+15s</button>
        <button id="timer-reset" class="danger">Reset</button>
      </div>
    </div>

    <!-- Log a Set Card -->
    <div class="card">
      <h2>Log a Set</h2>
      <input type="text" id="exercise" placeholder="Exercise (e.g., Bench Press)" />
      <input type="number" id="weight" placeholder="Weight (lbs)" inputmode="decimal" />
      <input type="number" id="reps" placeholder="Reps" inputmode="numeric" />
      <button id="save-btn">Save Set & Start Rest</button>
    </div>

    <!-- Recent Sets Card -->
    <div class="card">
      <h3>Recent Sets</h3>
      <div id="history-list">Loading...</div>
    </div>

    <button id="logout-btn" class="secondary">Sign Out</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    // REPLACE WITH YOUR FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyCjZmPHuE7cUYWpjmcSjfVMVuGcYQq0ocw",
      authDomain: "ruben-workout-tracker.firebaseapp.com",
      projectId: "ruben-workout-tracker",
      storageBucket: "ruben-workout-tracker.firebasestorage.app",
      messagingSenderId: "652225724430",
      appId: "1:652225724430:web:7af91bba34001bcbe2bc5f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const authSection = document.getElementById("auth-section");
    const appSection = document.getElementById("app-section");
    const historyList = document.getElementById("history-list");

    // --- SCREEN WAKE LOCK LOGIC ---
    let wakeLock = null;
    let wakeLockDesired = true;
    const wakeLockBtn = document.getElementById("wakelock-btn");

    async function enableWakeLock() {
      if (!("wakeLock" in navigator)) {
        wakeLockBtn.textContent = "Wake Lock Unsupported";
        return;
      }
      try {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLockBtn.textContent = "Screen Awake: ON";
        wakeLockBtn.className = "badge on";
        wakeLock.addEventListener("release", () => {
          wakeLockBtn.textContent = "Screen Awake: OFF";
          wakeLockBtn.className = "badge off";
        });
      } catch (err) {
        wakeLockBtn.textContent = "Tap to Keep Awake";
        wakeLockBtn.className = "badge off";
      }
    }

    async function disableWakeLock() {
      wakeLockDesired = false;
      if (wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }
      wakeLockBtn.textContent = "Screen Awake: OFF";
      wakeLockBtn.className = "badge off";
    }

    wakeLockBtn.addEventListener("click", () => {
      if (wakeLock) {
        disableWakeLock();
      } else {
        wakeLockDesired = true;
        enableWakeLock();
      }
    });

    // Re-acquire Wake Lock automatically when returning to the app
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && wakeLockDesired && auth.currentUser) {
        enableWakeLock();
      }
    });

    // --- TIMESTAMP-BASED REST TIMER LOGIC ---
    let defaultRestSeconds = 90;
    let remainingSeconds = defaultRestSeconds;
    let endTime = null;
    let timerInterval = null;

    const timerDisplay = document.getElementById("timer-display");
    const timerToggle = document.getElementById("timer-toggle");
    const defaultRestLabel = document.getElementById("default-rest-label");

    function formatTime(totalSec) {
      const s = Math.max(0, Math.ceil(totalSec));
      const mins = String(Math.floor(s / 60)).padStart(2, "0");
      const secs = String(s % 60).padStart(2, "0");
      return `${mins}:${secs}`;
    }

    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      } catch (e) {}
    }

    function updateTimerUI() {
      if (endTime) {
        remainingSeconds = (endTime - Date.now()) / 1000;
        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          endTime = null;
          remainingSeconds = 0;
          timerDisplay.textContent = "00:00";
          timerDisplay.classList.add("done");
          timerToggle.textContent = "Start";
          playChime();
          return;
        }
      }
      timerDisplay.classList.remove("done");
      timerDisplay.textContent = formatTime(remainingSeconds);
    }

    function startTimer(seconds = remainingSeconds) {
      if (seconds <= 0) seconds = defaultRestSeconds;
      endTime = Date.now() + seconds * 1000;
      timerToggle.textContent = "Pause";
      clearInterval(timerInterval);
      updateTimerUI();
      timerInterval = setInterval(updateTimerUI, 250);
    }

    function pauseTimer() {
      if (endTime) {
        remainingSeconds = Math.max(0, (endTime - Date.now()) / 1000);
        endTime = null;
      }
      clearInterval(timerInterval);
      timerInterval = null;
      timerToggle.textContent = "Start";
    }

    function resetTimer(seconds = defaultRestSeconds) {
      pauseTimer();
      remainingSeconds = seconds;
      timerDisplay.classList.remove("done");
      timerDisplay.textContent = formatTime(remainingSeconds);
    }

    timerToggle.addEventListener("click", () => {
      if (endTime) pauseTimer();
      else startTimer();
    });

    timerReset.addEventListener("click", () => resetTimer(defaultRestSeconds));

    document.getElementById("timer-plus").addEventListener("click", () => {
      if (endTime) endTime += 15000;
      else remainingSeconds += 15;
      updateTimerUI();
    });

    document.getElementById("timer-minus").addEventListener("click", () => {
      if (endTime) endTime = Math.max(Date.now(), endTime - 15000);
      else remainingSeconds = Math.max(0, remainingSeconds - 15);
      updateTimerUI();
    });

    document.querySelectorAll(".preset-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        defaultRestSeconds = Number(btn.dataset.sec);
        defaultRestLabel.textContent = `Auto-start: ${defaultRestSeconds}s`;
        startTimer(defaultRestSeconds);
      });
    });

    // --- AUTH & FIRESTORE LOGIC ---
    onAuthStateChanged(auth, (user) => {
      if (user) {
        authSection.classList.add("hidden");
        appSection.classList.remove("hidden");
        loadRecentSets();
        if (wakeLockDesired) enableWakeLock();
      } else {
        authSection.classList.remove("hidden");
        appSection.classList.add("hidden");
        disableWakeLock();
      }
    });

    document.getElementById("login-btn").addEventListener("click", async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        document.getElementById("auth-error").textContent = err.message;
      }
    });

    document.getElementById("save-btn").addEventListener("click", async () => {
      const exercise = document.getElementById("exercise").value.trim();
      const weight = Number(document.getElementById("weight").value);
      const reps = Number(document.getElementById("reps").value);
      if (!exercise || !reps) return alert("Enter an exercise and reps.");

      // Start rest timer immediately on tap
      startTimer(defaultRestSeconds);

      await addDoc(collection(db, "workout_sets"), {
        exercise,
        weight,
        reps,
        estimated1RM: Math.round(weight * (1 + reps / 30)),
        createdAt: serverTimestamp()
      });

      document.getElementById("weight").value = "";
      document.getElementById("reps").value = "";
    });

    function loadRecentSets() {
      const q = query(collection(db, "workout_sets"), orderBy("createdAt", "desc"), limit(15));
      onSnapshot(q, (snapshot) => {
        historyList.innerHTML = "";
        snapshot.forEach((doc) => {
          const d = doc.data();
          const div = document.createElement("div");
          div.className = "log-item";
          div.textContent = `${d.exercise}: ${d.weight} lbs × ${d.reps} reps (Est. 1RM: ${d.estimated1RM} lbs)`;
          historyList.appendChild(div);
        });
      });
    }

    document.getElementById("logout-btn").addEventListener("click", () => signOut(auth));
  </script>
</body>
</html>
