<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.json" />
  <title>Workout Tracker</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #111827; color: #f9fafb; margin: 0; padding: 16px; padding-bottom: 48px; }
    .card { background: #1f2937; padding: 16px; border-radius: 12px; margin-bottom: 16px; }
    h2, h3, h4 { margin-top: 0; }
    input, button { width: 100%; padding: 11px; margin-top: 8px; border-radius: 8px; border: none; font-size: 16px; box-sizing: border-box; }
    input { background: #374151; color: #fff; }
    button { background: #3b82f6; color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button.secondary { background: #4b5563; }
    button.success { background: #059669; }
    button.danger { background: #dc2626; }
    button.small { padding: 7px 10px; font-size: 13px; width: auto; margin-top: 0; }
    .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    .row button { margin-top: 0; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; background: #1f2937; color: #9ca3af; padding: 10px; margin-top: 0; }
    .tab-btn.active { background: #3b82f6; color: #fff; }
    .timer-display { font-size: 36px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; margin: 6px 0; color: #60a5fa; }
    .timer-display.done { color: #34d399; }
    .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #9ca3af; margin-bottom: 12px; }
    .badge { padding: 4px 10px; border-radius: 999px; font-weight: 600; font-size: 12px; cursor: pointer; border: none; width: auto; margin: 0; }
    .badge.on { background: #065f46; color: #6ee7b7; }
    .badge.off { background: #374151; color: #d1d5db; }
    .routine-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #374151; padding: 12px 0; }
    .routine-item:last-child { border-bottom: none; }
    .prev-banner { background: #111827; padding: 8px 10px; border-radius: 8px; font-size: 13px; color: #93c5fd; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .set-row { display: grid; grid-template-columns: 36px 1fr 1fr 48px; gap: 8px; align-items: center; margin-top: 8px; padding: 4px; border-radius: 8px; transition: background 0.2s; }
    .set-row.completed { background: rgba(6, 95, 70, 0.35); }
    .set-row input { margin-top: 0; padding: 9px; text-align: center; }
    .set-num { font-weight: 700; color: #9ca3af; text-align: center; font-size: 14px; }
    .check-btn { margin-top: 0; padding: 9px 0; background: #374151; font-size: 16px; }
    .set-row.completed .check-btn { background: #059669; }
    .log-item { border-bottom: 1px solid #374151; padding: 10px 0; font-size: 14px; }
    .log-item:last-child { border-bottom: none; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="auth-section" class="card">
    <h2>Sign In</h2>
    <input type="email" id="email" placeholder="Email" autocomplete="email" />
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
    <button id="login-btn">Log In</button>
    <p id="auth-error" style="color:#f87171; font-size:14px;"></p>
  </div>

  <!-- Main Workout App -->
  <div id="app-section" class="hidden">

    <!-- Screen Wake Lock Bar -->
    <div class="status-bar">
      <span>Workout Mode</span>
      <button id="wakelock-btn" class="badge off">Screen Awake: OFF</button>
    </div>

    <!-- Rest Timer Card -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="margin:0;">Rest Timer</h3>
        <span id="default-rest-label" style="font-size:13px; color:#9ca3af;">Auto-start: 90s</span>
      </div>
      <div id="timer-display" class="timer-display">01:30</div>
      <div class="row">
        <button class="secondary preset-btn" data-sec="60">1:00</button>
        <button class="secondary preset-btn" data-sec="90">1:30</button>
        <button class="secondary preset-btn" data-sec="120">2:00</button>
        <button class="secondary preset-btn" data-sec="180">3:00</button>
      </div>
      <div class="row">
        <button id="timer-minus" class="secondary">-15s</button>
        <button id="timer-toggle">Start</button>
        <button id="timer-plus" class="secondary">+15s</button>
        <button id="timer-reset" class="danger">Reset</button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs">
      <button id="tab-routines" class="tab-btn active">Routines</button>
      <button id="tab-quick" class="tab-btn">Quick Set</button>
      <button id="tab-history" class="tab-btn">History</button>
    </div>

    <!-- VIEW 1: Routines & Active Workout -->
    <div id="view-routines">
      <!-- Routine List & Creator (Hidden during an active workout) -->
      <div id="routine-manager">
        <div class="card">
          <h3>My Routines (Unlimited)</h3>
          <div id="routines-list">Loading routines...</div>
        </div>

        <div class="card">
          <h3>Create New Routine</h3>
          <input type="text" id="new-routine-name" placeholder="Routine Name (e.g., Push Day A)" />
          <div id="builder-exercises"></div>
          <div class="row" style="margin-top:12px;">
            <input type="text" id="builder-ex-name" placeholder="Exercise name" style="margin-top:0; flex:2;" />
            <input type="number" id="builder-ex-sets" placeholder="Sets" value="3" inputmode="numeric" style="margin-top:0; flex:1;" />
            <button id="add-builder-ex-btn" class="secondary small" style="padding:11px 14px;">+ Add</button>
          </div>
          <button id="save-routine-btn" class="success" style="margin-top:12px;">Save Routine</button>
        </div>
      </div>

      <!-- Active Workout Session -->
      <div id="active-workout" class="hidden">
        <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <span style="font-size:12px; color:#34d399; font-weight:700;">ACTIVE WORKOUT</span>
            <h2 id="active-routine-title" style="margin:2px 0 0 0;">Push Day</h2>
          </div>
          <button id="finish-workout-btn" class="success small" style="padding:10px 14px;">Finish</button>
        </div>
        <div id="active-exercises-container"></div>
      </div>
    </div>

    <!-- VIEW 2: Quick Single Set Logger -->
    <div id="view-quick" class="hidden">
      <div class="card">
        <h3>Log a Single Set</h3>
        <input type="text" id="quick-exercise" placeholder="Exercise (e.g., Bench Press)" />
        <div id="quick-prev-banner" class="prev-banner hidden" style="margin-top:8px; margin-bottom:0;"></div>
        <input type="number" id="quick-weight" placeholder="Weight (lbs)" inputmode="decimal" />
        <input type="number" id="quick-reps" placeholder="Reps" inputmode="numeric" />
        <button id="quick-save-btn">Save Set & Start Rest</button>
      </div>
    </div>

    <!-- VIEW 3: Recent History -->
    <div id="view-history" class="hidden">
      <div class="card">
        <h3>Recent Sets</h3>
        <div id="history-list">Loading...</div>
      </div>
    </div>

    <button id="logout-btn" class="secondary" style="margin-top:8px;">Sign Out</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    // REPLACE WITH YOUR FIREBASE CONFIG
    const firebaseConfig = {
    apiKey: "AIzaSyCjZmPHuE7cUYWpjmcSjfVMVuGcYQq0ocw",
    authDomain: "ruben-workout-tracker.firebaseapp.com",
    projectId: "ruben-workout-tracker",
    storageBucket: "ruben-workout-tracker.firebasestorage.app",
    messagingSenderId: "652225724430",
    appId: "1:652225724430:web:7af91bba34001bcbe2bc5f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- SCREEN WAKE LOCK ---
    let wakeLock = null;
    let wakeLockDesired = true;
    const wakeLockBtn = document.getElementById("wakelock-btn");

    async function enableWakeLock() {
      if (!("wakeLock" in navigator)) {
        wakeLockBtn.textContent = "Wake Lock Unsupported";
        return;
      }
      try {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLockBtn.textContent = "Screen Awake: ON";
        wakeLockBtn.className = "badge on";
        wakeLock.addEventListener("release", () => {
          wakeLockBtn.textContent = "Screen Awake: OFF";
          wakeLockBtn.className = "badge off";
        });
      } catch (err) {
        wakeLockBtn.textContent = "Tap to Keep Awake";
        wakeLockBtn.className = "badge off";
      }
    }

    async function disableWakeLock() {
      wakeLockDesired = false;
      if (wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }
      wakeLockBtn.textContent = "Screen Awake: OFF";
      wakeLockBtn.className = "badge off";
    }

    wakeLockBtn.addEventListener("click", () => {
      if (wakeLock) disableWakeLock();
      else { wakeLockDesired = true; enableWakeLock(); }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && wakeLockDesired && auth.currentUser) enableWakeLock();
    });

    // --- TIMESTAMP-BASED REST TIMER ---
    let defaultRestSeconds = 90;
    let remainingSeconds = defaultRestSeconds;
    let endTime = null;
    let timerInterval = null;

    const timerDisplay = document.getElementById("timer-display");
    const timerToggle = document.getElementById("timer-toggle");
    const timerReset = document.getElementById("timer-reset");
    const defaultRestLabel = document.getElementById("default-rest-label");

    function formatTime(totalSec) {
      const s = Math.max(0, Math.ceil(totalSec));
      return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
    }

    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      } catch (e) {}
    }

    function updateTimerUI() {
      if (endTime) {
        remainingSeconds = (endTime - Date.now()) / 1000;
        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          endTime = null;
          remainingSeconds = 0;
          timerDisplay.textContent = "00:00";
          timerDisplay.classList.add("done");
          timerToggle.textContent = "Start";
          playChime();
          return;
        }
      }
      timerDisplay.classList.remove("done");
      timerDisplay.textContent = formatTime(remainingSeconds);
    }

    function startTimer(seconds = remainingSeconds) {
      if (seconds <= 0) seconds = defaultRestSeconds;
      endTime = Date.now() + seconds * 1000;
      timerToggle.textContent = "Pause";
      clearInterval(timerInterval);
      updateTimerUI();
      timerInterval = setInterval(updateTimerUI, 250);
    }

    function pauseTimer() {
      if (endTime) {
        remainingSeconds = Math.max(0, (endTime - Date.now()) / 1000);
        endTime = null;
      }
      clearInterval(timerInterval);
      timerInterval = null;
      timerToggle.textContent = "Start";
    }

    function resetTimer(seconds = defaultRestSeconds) {
      pauseTimer();
      remainingSeconds = seconds;
      timerDisplay.classList.remove("done");
      timerDisplay.textContent = formatTime(remainingSeconds);
    }

    timerToggle.addEventListener("click", () => endTime ? pauseTimer() : startTimer());
    timerReset.addEventListener("click", () => resetTimer(defaultRestSeconds));
    document.getElementById("timer-plus").addEventListener("click", () => {
      if (endTime) endTime += 15000; else remainingSeconds += 15;
      updateTimerUI();
    });
    document.getElementById("timer-minus").addEventListener("click", () => {
      if (endTime) endTime = Math.max(Date.now(), endTime - 15000); else remainingSeconds = Math.max(0, remainingSeconds - 15);
      updateTimerUI();
    });
    document.querySelectorAll(".preset-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        defaultRestSeconds = Number(btn.dataset.sec);
        defaultRestLabel.textContent = `Auto-start: ${defaultRestSeconds}s`;
        startTimer(defaultRestSeconds);
      });
    });

    // --- TABS NAVIGATION ---
    const views = {
      routines: document.getElementById("view-routines"),
      quick: document.getElementById("view-quick"),
      history: document.getElementById("view-history")
    };
    const tabs = {
      routines: document.getElementById("tab-routines"),
      quick: document.getElementById("tab-quick"),
      history: document.getElementById("tab-history")
    };

    function switchTab(name) {
      Object.keys(views).forEach((key) => {
        views[key].classList.toggle("hidden", key !== name);
        tabs[key].classList.toggle("active", key === name);
      });
    }
    Object.keys(tabs).forEach((key) => tabs[key].addEventListener("click", () => switchTab(key)));

    // --- IN-MEMORY CACHE FOR INLINE PREVIOUS PERFORMANCE ---
    // Stores the most recent session's sets per normalized exercise name
    let previousSetsByExercise = {};

    function normalizeName(name) {
      return name.trim().toLowerCase();
    }

    function buildPreviousLookup(allSets) {
      // allSets is ordered newest -> oldest
      const grouped = {};
      for (const s of allSets) {
        const key = normalizeName(s.exercise || "");
        if (!key) continue;
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(s);
      }

      const result = {};
      for (const key of Object.keys(grouped)) {
        const list = grouped[key];
        // Take sets from the most recent date (within 6 hours of the latest set for that exercise)
        const latestTime = list[0].createdAt?.toMillis ? list[0].createdAt.toMillis() : Date.now();
        const sessionSets = list
          .filter((item) => {
            const t = item.createdAt?.toMillis ? item.createdAt.toMillis() : latestTime;
            return Math.abs(latestTime - t) < 6 * 60 * 60 * 1000;
          })
          .reverse(); // chronological order within that session
        result[key] = sessionSets;
      }
      previousSetsByExercise = result;
    }

    // --- ROUTINE BUILDER & SAVED ROUTINES ---
    let draftExercises = [];
    const builderList = document.getElementById("builder-exercises");

    function renderBuilderExercises() {
      builderList.innerHTML = "";
      draftExercises.forEach((ex, idx) => {
        const row = document.createElement("div");
        row.className = "routine-item";
        row.innerHTML = `<span>${ex.name} (${ex.sets} sets)</span>`;
        const delBtn = document.createElement("button");
        delBtn.className = "danger small";
        delBtn.textContent = "Remove";
        delBtn.onclick = () => {
          draftExercises.splice(idx, 1);
          renderBuilderExercises();
        };
        row.appendChild(delBtn);
        builderList.appendChild(row);
      });
    }

    document.getElementById("add-builder-ex-btn").addEventListener("click", () => {
      const nameInput = document.getElementById("builder-ex-name");
      const setsInput = document.getElementById("builder-ex-sets");
      const name = nameInput.value.trim();
      const sets = Math.max(1, Number(setsInput.value) || 3);
      if (!name) return alert("Enter an exercise name first.");
      draftExercises.push({ name, sets });
      nameInput.value = "";
      setsInput.value = "3";
      renderBuilderExercises();
    });

    document.getElementById("save-routine-btn").addEventListener("click", async () => {
      const nameInput = document.getElementById("new-routine-name");
      const name = nameInput.value.trim();
      if (!name) return alert("Enter a routine name.");
      if (draftExercises.length === 0) return alert("Add at least one exercise to the routine.");

      await addDoc(collection(db, "routines"), {
        name,
        exercises: draftExercises,
        createdAt: serverTimestamp()
      });

      nameInput.value = "";
      draftExercises = [];
      renderBuilderExercises();
    });

    function loadRoutines() {
      const routinesList = document.getElementById("routines-list");
      const q = query(collection(db, "routines"), orderBy("createdAt", "asc"));
      onSnapshot(q, (snapshot) => {
        routinesList.innerHTML = "";
        if (snapshot.empty) {
          routinesList.innerHTML = `<p style="color:#9ca3af; font-size:14px; margin:0;">No routines saved yet. Create your first one below.</p>`;
          return;
        }
        snapshot.forEach((docSnap) => {
          const r = docSnap.data();
          const summary = (r.exercises || []).map((e) => `${e.name} (${e.sets})`).join(" • ");
          const item = document.createElement("div");
          item.className = "routine-item";
          item.innerHTML = `
            <div style="padding-right:10px;">
              <div style="font-weight:700;">${r.name}</div>
              <div style="font-size:12px; color:#9ca3af; margin-top:2px;">${summary}</div>
            </div>
            <div style="display:flex; gap:6px; flex-shrink:0;">
              <button class="success small start-btn">Start</button>
              <button class="danger small del-btn">✕</button>
            </div>
          `;
          item.querySelector(".start-btn").onclick = () => startWorkoutSession(r);
          item.querySelector(".del-btn").onclick = async () => {
            if (confirm(`Delete "${r.name}"?`)) await deleteDoc(doc(db, "routines", docSnap.id));
          };
          routinesList.appendChild(item);
        });
      });
    }

    // --- ACTIVE WORKOUT SESSION WITH INLINE HISTORY ---
    const routineManager = document.getElementById("routine-manager");
    const activeWorkoutDiv = document.getElementById("active-workout");
    const activeContainer = document.getElementById("active-exercises-container");

    function createSetRow(exerciseName, setIndex, prevSet) {
      const row = document.createElement("div");
      row.className = "set-row";

      const prevWeight = prevSet ? prevSet.weight : "";
      const prevReps = prevSet ? prevSet.reps : "";

      row.innerHTML = `
        <div class="set-num">${setIndex}</div>
        <input type="number" class="w-in" placeholder="${prevWeight !== "" ? prevWeight + " lbs" : "lbs"}" inputmode="decimal" />
        <input type="number" class="r-in" placeholder="${prevReps !== "" ? prevReps + " reps" : "reps"}" inputmode="numeric" />
        <button class="check-btn">✓</button>
      `;

      const wIn = row.querySelector(".w-in");
      const rIn = row.querySelector(".r-in");
      const checkBtn = row.querySelector(".check-btn");

      checkBtn.onclick = async () => {
        if (row.classList.contains("completed")) return;
        const weight = Number(wIn.value || prevWeight);
        const reps = Number(rIn.value || prevReps);
        if (!reps) return alert("Enter reps (or tap Copy above to use last session's numbers).");

        wIn.value = weight;
        rIn.value = reps;
        row.classList.add("completed");
        wIn.disabled = true;
        rIn.disabled = true;
        checkBtn.disabled = true;

        startTimer(defaultRestSeconds);

        await addDoc(collection(db, "workout_sets"), {
          exercise: exerciseName,
          weight,
          reps,
          estimated1RM: Math.round(weight * (1 + reps / 30)),
          createdAt: serverTimestamp()
        });
      };

      return row;
    }

    function startWorkoutSession(routine) {
      routineManager.classList.add("hidden");
      activeWorkoutDiv.classList.remove("hidden");
      document.getElementById("active-routine-title").textContent = routine.name;
      activeContainer.innerHTML = "";

      (routine.exercises || []).forEach((ex) => {
        const card = document.createElement("div");
        card.className = "card";

        const prevList = previousSetsByExercise[normalizeName(ex.name)] || [];
        const prevText = prevList.length > 0
          ? prevList.map((s) => `${s.weight}×${s.reps}`).join(", ")
          : "No prior logs";

        const header = document.createElement("div");
        header.innerHTML = `<h3 style="margin-bottom:8px;">${ex.name}</h3>`;
        card.appendChild(header);

        const banner = document.createElement("div");
        banner.className = "prev-banner";
        banner.innerHTML = `<span><strong>Last:</strong> ${prevText}</span>`;

        const setsWrapper = document.createElement("div");

        if (prevList.length > 0) {
          const copyBtn = document.createElement("button");
          copyBtn.className = "secondary small";
          copyBtn.textContent = "Copy Last";
          copyBtn.onclick = () => {
            const rows = setsWrapper.querySelectorAll(".set-row");
            rows.forEach((r, idx) => {
              if (!r.classList.contains("completed") && prevList[idx]) {
                r.querySelector(".w-in").value = prevList[idx].weight;
                r.querySelector(".r-in").value = prevList[idx].reps;
              }
            });
          };
          banner.appendChild(copyBtn);
        }
        card.appendChild(banner);

        let setCount = ex.sets || 3;
        for (let i = 1; i <= setCount; i++) {
          setsWrapper.appendChild(createSetRow(ex.name, i, prevList[i - 1]));
        }
        card.appendChild(setsWrapper);

        const addSetBtn = document.createElement("button");
        addSetBtn.className = "secondary";
        addSetBtn.style.marginTop = "10px";
        addSetBtn.style.padding = "8px";
        addSetBtn.style.fontSize = "14px";
        addSetBtn.textContent = "+ Add Set";
        addSetBtn.onclick = () => {
          setCount += 1;
          setsWrapper.appendChild(createSetRow(ex.name, setCount, prevList[setCount - 1]));
        };
        card.appendChild(addSetBtn);

        activeContainer.appendChild(card);
      });
    }

    document.getElementById("finish-workout-btn").addEventListener("click", () => {
      if (confirm("Finish this workout session?")) {
        activeWorkoutDiv.classList.add("hidden");
        routineManager.classList.remove("hidden");
      }
    });

    // --- QUICK SINGLE SET WITH INLINE PREVIOUS LOOKUP ---
    const quickExInput = document.getElementById("quick-exercise");
    const quickPrevBanner = document.getElementById("quick-prev-banner");

    quickExInput.addEventListener("input", () => {
      const prevList = previousSetsByExercise[normalizeName(quickExInput.value)] || [];
      if (prevList.length > 0) {
        const text = prevList.map((s) => `${s.weight}×${s.reps}`).join(", ");
        quickPrevBanner.textContent = `Last: ${text}`;
        quickPrevBanner.classList.remove("hidden");
      } else {
        quickPrevBanner.classList.add("hidden");
      }
    });

    document.getElementById("quick-save-btn").addEventListener("click", async () => {
      const exercise = quickExInput.value.trim();
      const weight = Number(document.getElementById("quick-weight").value);
      const reps = Number(document.getElementById("quick-reps").value);
      if (!exercise || !reps) return alert("Enter an exercise and reps.");

      startTimer(defaultRestSeconds);

      await addDoc(collection(db, "workout_sets"), {
        exercise,
        weight,
        reps,
        estimated1RM: Math.round(weight * (1 + reps / 30)),
        createdAt: serverTimestamp()
      });

      document.getElementById("quick-weight").value = "";
      document.getElementById("quick-
